name: MLOps CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mlops-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.18'
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run python -m pytest --cov=audio_engine --cov=agents --cov=rag_engine --cov=api --cov=training --cov-report=term-missing --cov-report=xml
      - run: docker compose config --quiet
        env:
          DEEPSEEK_API_KEY: ''
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
  images:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api-gateway, audio-engine, llm-server, agent-orchestrator, mlflow-server, vector-db]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/${{ matrix.service }}.Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
