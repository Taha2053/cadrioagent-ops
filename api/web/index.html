<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CardioAgent | Upload PCG</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="card">
    <h1>CardioAgent</h1>
    <p>Upload a heart sound recording in WAV format.</p>

    <form id="upload-form">
      <label for="audio-file">Choose a recording</label>
      <input
        id="audio-file"
        name="file"
        type="file"
        accept=".wav,audio/wav"
        required
      >

      <button type="submit">Upload WAV</button>
    </form>

    <p id="message" role="status"></p>
    <pre id="result" hidden></pre>
  </main>

  <script>
    const form = document.querySelector("#upload-form");
    const fileInput = document.querySelector("#audio-file");
    const message = document.querySelector("#message");
    const result = document.querySelector("#result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      message.textContent = "Uploading...";
      result.hidden = true;

      const formData = new FormData();
      formData.append("file", fileInput.files[0]);

      try {
        const response = await fetch("/analyze_pcg", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          message.textContent = data.detail || "Upload failed.";
          return;
        }

        message.textContent = "File received successfully.";
        result.textContent = JSON.stringify(data, null, 2);
        result.hidden = false;
      } catch (error) {
        message.textContent = "Could not connect to the server.";
        console.error(error);
      }
    });
  </script>
</body>
</html>
